# Builds the site and publishes it to GitHub Pages on every push to main.
# The pages in docs/ are made here (npm run pages), so they are not kept in git.
# The deploy may wait 30 minutes (GitHub's automatic deploy gives up after 10), and
# "Run workflow" on the Actions tab publishes again without an empty commit.
# Needs: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
